<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ibro — software developer</title>
  <desc id="desc">A minimal light profile banner with the words Ibro, software developer, problem solver, and builder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="54" r="120" fill="#dbeafe" opacity="0.65"/>
  <circle cx="1140" cy="260" r="170" fill="#e0e7ff" opacity="0.7"/>
  <path d="M0 255 C250 195 430 300 690 232 C880 180 1010 200 1200 140 L1200 300 L0 300 Z" fill="#dbeafe" opacity="0.42"/>
  <g transform="translate(72 65)">
    <rect x="0" y="0" width="62" height="62" rx="18" fill="#0f172a"/>
    <path d="M18 43V21h8v22zm13 0V12h8v31zm13 0V27h8v16z" fill="#fff"/>
    <text x="92" y="30" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="750" letter-spacing="-1.5">Ibro</text>
    <text x="93" y="61" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500">SOFTWARE DEVELOPER</text>
    <rect x="0" y="105" width="610" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="0" y="105" width="178" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="154" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650">Problem solver.</text>
    <text x="215" y="154" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650">Curious mind.</text>
    <text x="396" y="154" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650">Builder.</text>
  </g>
  <g transform="translate(965 78)" filter="url(#shadow)">
    <rect width="142" height="142" rx="32" fill="#fff"/>
    <rect x="28" y="28" width="86" height="86" rx="22" fill="#2563eb"/>
    <path d="M54 71l14 14 28-30" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
